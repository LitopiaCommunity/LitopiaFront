      name="description"
      content="Litopia célèbre 10 ans d'aventure. Ultime Saison v26.2, carte éternelle. Serveur UHC Vanilla privé. Archives téléchargeables."
    />
    <script>
      (function () {
        var root = document.documentElement;
        var storedSettings = null;
        var systemTheme = "light";

        if (window.matchMedia) {
          systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";
        }

        try {
          var rawSettings = window.localStorage.getItem("theme");
          if (rawSettings) {
            var parsedSettings = JSON.parse(rawSettings);
            if (
              parsedSettings &&
              (parsedSettings.theme === "dark" ||
                parsedSettings.theme === "light") &&
              typeof parsedSettings.overrideSystemTheme === "boolean"
            ) {
              storedSettings = parsedSettings;
            }
          }
        } catch (_error) {
          storedSettings = null;
        }

        var resolvedTheme =
          storedSettings && storedSettings.overrideSystemTheme
            ? storedSettings.theme
            : systemTheme;

        root.classList.toggle("light-theme", resolvedTheme === "light");
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
